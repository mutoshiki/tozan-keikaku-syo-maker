<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="YAMAPから登山計画書を作成します。" />
  <script>
    (() => {
      const key = 'sanpokai-theme-preference-v1';
      let preference = 'system';
      try {
        const stored = localStorage.getItem(key);
        if (stored === 'system' || stored === 'light' || stored === 'dark') preference = stored;
      } catch (_) {}
      const systemDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const dark = preference === 'dark' || (preference === 'system' && systemDark);
      document.documentElement.dataset.carbonTheme = dark ? 'g100' : 'white';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#161616' : '#ffffff';
    })();
  </script>
  <title>登山計画書メーカー</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
