name: Live Gemini browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund puppeteer-core pdf-lib
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tozan-http.log 2>&1 &
          echo $! > /tmp/tozan-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tozan-http.log
          exit 1
      - name: Run real YAMAP browser to PDF flow
        shell: bash
        run: |
          mkdir -p qa-output
          cat > qa-e2e.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { PDFDocument } from 'pdf-lib';
          import fs from 'node:fs';

          const chrome = process.env.CHROME_BIN || '/usr/bin/google-chrome';
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 1280, height: 900, deviceScaleFactor: 1 });
          const consoleErrors = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', err => consoleErrors.push(String(err)));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle0' });
          const setValue = async (selector, value) => page.$eval(selector, (el, v) => {
            el.value = v;
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
          }, value);
          await setValue('#eventDate', '2026-09-24');
          await setValue('#meetingTime', '05:00');
          await setValue('#meetingPlace', '信州大学 松本キャンパス サークルボックス前');
          await setValue('#mountainName', '根子岳・四阿山');
          await setValue('#areaMunicipality', '四阿山 / 上田市');
          await setValue('#plannerStudentId', 'QA0000');
          await setValue('#plannerName', '検証太郎');
          await setValue('#plannerPhone', '090-0000-0000');
          await setValue('#baseName', '留守本部太郎');
          await setValue('#basePhone', '090-1111-1111');
          await page.click('#next-button');
          await page.waitForSelector('.step[data-step="2"].is-active');

          const input = await page.$('#file-input');
          await input.uploadFile('qa/fixtures/metrics.webp', 'qa/fixtures/itin1.webp', 'qa/fixtures/itin2.webp');
          await page.waitForFunction(() => window.__tozanApp?.state?.uploads?.length === 3);
          await page.click('#analyze-button');
          await page.waitForSelector('.step[data-step="3"].is-active', { timeout: 90000 });

          const values = await page.evaluate(() => ({
            duration: document.querySelector('#durationMinutes').value,
            distance: document.querySelector('#distanceKm').value,
            ascent: document.querySelector('#ascentM').value,
            descent: document.querySelector('#descentM').value,
            rows: [...document.querySelectorAll('#itinerary-body tr')].map(tr => ({
              time: tr.querySelector('.row-time').value,
              place: tr.querySelector('.row-place').value,
              major: tr.querySelector('.row-major').checked,
            })),
            routeSameAsUpload: window.__tozanApp.state.routeImage === window.__tozanApp.state.uploads[0].url,
          }));
          const fail = m => { throw new Error(m); };
          if (values.duration !== '370') fail(`duration=${values.duration}`);
          if (values.distance !== '9.5') fail(`distance=${values.distance}`);
          if (values.ascent !== '987') fail(`ascent=${values.ascent}`);
          if (values.descent !== '988') fail(`descent=${values.descent}`);
          if (values.rows.length !== 13) fail(`rows=${values.rows.length}`);
          if (!values.routeSameAsUpload) fail('route image was transformed/cropped');
          const branches = values.rows.filter(r => r.place === '分岐');
          if (branches.length !== 6 || branches.some(r => r.major)) fail('分岐 major=false invariant failed');
          const required = new Map([['07:00','菅平牧場公衆トイレ'],['09:00','根子岳'],['10:45','四阿山'],['11:35','中四阿'],['12:05','小四阿'],['13:10','菅平牧場公衆トイレ']]);
          for (const [time, place] of required) if (!values.rows.some(r => r.time === time && r.place === place)) fail(`${time} ${place} missing`);

          await page.evaluate(() => {
            const row = [...document.querySelectorAll('#itinerary-body tr')].find(tr => tr.querySelector('.row-place').value === '四阿山');
            const input = row.querySelector('.row-rest');
            input.value = '60';
            input.dispatchEvent(new Event('input', { bubbles: true }));
          });
          await page.waitForFunction(() => [...document.querySelectorAll('#itinerary-body tr')].some(tr => tr.querySelector('.row-place').value === '中四阿' && tr.querySelector('.adjusted').textContent.includes('12:35')));
          const shifted = await page.evaluate(() => [...document.querySelectorAll('#itinerary-body tr')].map(tr => ({ place: tr.querySelector('.row-place').value, adjusted: tr.querySelector('.adjusted').textContent })));
          if (!shifted.some(r => r.place === '小四阿' && r.adjusted.includes('13:05'))) fail('rest shift for 小四阿 failed');
          if (!shifted.some(r => r.place === '菅平牧場公衆トイレ' && r.adjusted.includes('14:10'))) fail('rest shift for goal failed');

          await page.click('#next-button');
          await page.waitForSelector('.step[data-step="4"].is-active');
          await page.waitForSelector('.route-image-frame img');
          const routeInfo = await page.$eval('.route-image-frame img', img => ({ width: img.naturalWidth, height: img.naturalHeight, src: img.src }));
          const uploadInfo = await page.evaluate(() => ({ src: window.__tozanApp.state.uploads[0].url }));
          if (routeInfo.src !== uploadInfo.src) fail('preview route src differs from original upload data URL');
          if (routeInfo.width !== 360 || routeInfo.height !== 221) fail(`route dimensions=${routeInfo.width}x${routeInfo.height}`);
          const previewText = await page.$eval('#document-preview', el => el.innerText);
          for (const expected of ['6時間10分','9.5km','987m','988m','根子岳','四阿山','14:10']) if (!previewText.includes(expected)) fail(`preview missing ${expected}`);
          await page.screenshot({ path: 'qa-output/preview.png', fullPage: true });

          await page.emulateMediaType('print');
          const objectFit = await page.$eval('.route-image-frame img', img => getComputedStyle(img).objectFit);
          if (objectFit !== 'contain') fail(`print object-fit=${objectFit}`);
          const pdf = await page.pdf({ format: 'A4', printBackground: true, preferCSSPageSize: true, displayHeaderFooter: false });
          fs.writeFileSync('qa-output/plan.pdf', pdf);
          const pdfDoc = await PDFDocument.load(pdf);
          if (pdfDoc.getPageCount() !== 3) fail(`PDF pages=${pdfDoc.getPageCount()}`);
          fs.writeFileSync('qa-output/result.json', JSON.stringify({ values, shifted, routeInfo: { width: routeInfo.width, height: routeInfo.height }, objectFit, pdfPages: pdfDoc.getPageCount(), consoleErrors }, null, 2));
          if (consoleErrors.length) fail(`console errors: ${consoleErrors.join(' | ')}`);
          console.log('LIVE_BROWSER_PDF_QA_PASS');
          await browser.close();
          NODE
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then echo 'Chrome/Chromium not found'; exit 1; fi
          CHROME_BIN="$CHROME_BIN" node qa-e2e.mjs
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-pdf-qa
          path: qa-output
          if-no-files-found: warn
