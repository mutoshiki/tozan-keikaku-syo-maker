name: PDF visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pdf-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund puppeteer-core pdf-lib
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tozan-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tozan-http.log
          exit 1
      - name: Generate and verify PDF with confirmed Gemini result
        shell: bash
        run: |
          mkdir -p qa-output
          cat > qa-pdf-visual.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { PDFDocument } from 'pdf-lib';
          import fs from 'node:fs';

          const confirmed = {
            durationMinutes: 370,
            distanceKm: 9.5,
            ascentM: 987,
            descentM: 988,
            routeImageIndex: 0,
            itinerary: [
              {time:'07:00',place:'菅平牧場公衆トイレ',major:true},
              {time:'09:00',place:'根子岳',major:true},
              {time:'10:30',place:'分岐',major:false},
              {time:'10:40',place:'分岐',major:false},
              {time:'10:45',place:'四阿山',major:true},
              {time:'10:50',place:'分岐',major:false},
              {time:'11:00',place:'分岐',major:false},
              {time:'11:10',place:'分岐',major:false},
              {time:'11:35',place:'中四阿',major:true},
              {time:'11:45',place:'分岐',major:false},
              {time:'12:05',place:'小四阿',major:true},
              {time:'13:05',place:'四阿山登山口（中四阿経由）',major:true},
              {time:'13:10',place:'菅平牧場公衆トイレ',major:true}
            ],
            warnings: []
          };

          const chrome = process.env.CHROME_BIN;
          const browser = await puppeteer.launch({ executablePath: chrome, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const page = await browser.newPage();
          await page.setRequestInterception(true);
          page.on('request', request => {
            if (request.url() === 'https://tozan-keikaku-syo-maker.610unko.workers.dev/analyze') {
              request.respond({
                status: 200,
                contentType: 'application/json',
                headers: { 'Access-Control-Allow-Origin': 'http://127.0.0.1:4173' },
                body: JSON.stringify(confirmed),
              });
            } else {
              request.continue();
            }
          });
          const fail = m => { throw new Error(m); };
          const pageErrors = [];
          page.on('pageerror', err => pageErrors.push(String(err)));
          await page.setViewport({ width: 1280, height: 900, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle0' });

          const setValue = async (selector, value) => page.$eval(selector, (el, v) => {
            el.value = v;
            el.dispatchEvent(new Event('input', {bubbles:true}));
            el.dispatchEvent(new Event('change', {bubbles:true}));
          }, value);
          await setValue('#eventDate','2026-09-24');
          await setValue('#meetingTime','05:00');
          await setValue('#meetingPlace','信州大学 松本キャンパス サークルボックス前');
          await setValue('#mountainName','根子岳・四阿山');
          await setValue('#areaMunicipality','四阿山 / 上田市');
          await setValue('#plannerStudentId','QA0000');
          await setValue('#plannerName','検証太郎');
          await setValue('#plannerPhone','090-0000-0000');
          await setValue('#baseName','留守本部太郎');
          await setValue('#basePhone','090-1111-1111');
          await page.click('#next-button');

          const input = await page.$('#file-input');
          await input.uploadFile('qa/fixtures/metrics.webp','qa/fixtures/itin1.webp','qa/fixtures/itin2.webp');
          await page.waitForFunction(() => window.__tozanApp?.state?.uploads?.length === 3);
          await page.click('#analyze-button');
          await page.waitForSelector('.step[data-step="3"].is-active');

          const stateCheck = await page.evaluate(() => ({
            routeSame: window.__tozanApp.state.routeImage === window.__tozanApp.state.uploads[0].url,
            rows: window.__tozanApp.state.itinerary.length,
            duration: window.__tozanApp.state.metrics.durationMinutes,
          }));
          if (!stateCheck.routeSame) fail('route image changed/cropped');
          if (stateCheck.rows !== 13 || stateCheck.duration !== 370) fail('confirmed Gemini result not applied');

          await page.evaluate(() => {
            const row = [...document.querySelectorAll('#itinerary-body tr')].find(tr => tr.querySelector('.row-place').value === '四阿山');
            const rest = row.querySelector('.row-rest');
            rest.value = '60';
            rest.dispatchEvent(new Event('input', {bubbles:true}));
          });
          await page.waitForFunction(() => [...document.querySelectorAll('#itinerary-body tr')].some(tr => tr.querySelector('.row-place').value === '中四阿' && tr.querySelector('.adjusted').textContent.includes('12:35')));
          await page.click('#next-button');
          await page.waitForSelector('.step[data-step="4"].is-active');
          await page.waitForSelector('.route-image-frame img');

          const route = await page.$eval('.route-image-frame img', img => ({w:img.naturalWidth,h:img.naturalHeight,src:img.src}));
          const original = await page.evaluate(() => window.__tozanApp.state.uploads[0].url);
          if (route.src !== original || route.w !== 360 || route.h !== 221) fail(`route source/dimensions changed: ${route.w}x${route.h}`);
          const previewText = await page.$eval('#document-preview', el => el.innerText);
          for (const text of ['根子岳・四阿山登山計画書','6時間10分','9.5km','987m','988m','菅平牧場公衆トイレ','14:10','緊急連絡先']) if (!previewText.includes(text)) fail(`preview missing: ${text}`);
          await page.screenshot({path:'qa-output/preview.png',fullPage:true});

          await page.emulateMediaType('print');
          const fit = await page.$eval('.route-image-frame img', img => getComputedStyle(img).objectFit);
          if (fit !== 'contain') fail(`print object-fit=${fit}`);
          const pdf = await page.pdf({format:'A4',printBackground:true,preferCSSPageSize:true,displayHeaderFooter:false});
          fs.writeFileSync('qa-output/plan.pdf',pdf);
          const doc = await PDFDocument.load(pdf);
          if (doc.getPageCount() !== 3) fail(`PDF pages=${doc.getPageCount()}`);
          fs.writeFileSync('qa-output/result.json',JSON.stringify({stateCheck,route:{w:route.w,h:route.h},objectFit:fit,pdfPages:doc.getPageCount(),pageErrors},null,2));
          if (pageErrors.length) fail(pageErrors.join(' | '));
          console.log('PDF_VISUAL_QA_PASS');
          await browser.close();
          NODE
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node qa-pdf-visual.mjs
      - name: Upload PDF QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-visual-qa
          path: qa-output
          if-no-files-found: warn
