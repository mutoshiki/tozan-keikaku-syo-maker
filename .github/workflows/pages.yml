name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node tests/dark-mode-browser-smoke.cjs
        env:
          CHROMIUM_POLICY_DIR: /tmp/empty-chromium-policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            test-results/
            dark-mode-browser-evidence/
          if-no-files-found: ignore
