name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  live-gemini-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call deployed Worker with real YAMAP crops
        shell: bash
        run: |
          set -euo pipefail
          b64() { base64 -w0 "$1"; }
          cat > /tmp/payload.json <<EOF
          {"images":[
            {"mimeType":"image/webp","data":"$(b64 qa/fixtures/metrics.webp)"},
            {"mimeType":"image/webp","data":"$(b64 qa/fixtures/itin1.webp)"},
            {"mimeType":"image/webp","data":"$(b64 qa/fixtures/itin2.webp)"}
          ]}
          EOF
          curl --fail-with-body --silent --show-error \
            -H 'Origin: https://mutoshiki.github.io' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            'https://tozan-keikaku-syo-maker.610unko.workers.dev/analyze' \
            -o /tmp/result.json
          cat /tmp/result.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
          const fail = (m) => { console.error(m); process.exit(1); };
          if (r.durationMinutes !== 370) fail(`durationMinutes=${r.durationMinutes}`);
          if (Number(r.distanceKm) !== 9.5) fail(`distanceKm=${r.distanceKm}`);
          if (Number(r.ascentM) !== 987) fail(`ascentM=${r.ascentM}`);
          if (Number(r.descentM) !== 988) fail(`descentM=${r.descentM}`);
          const expected = [
            ['07:00','菅平牧場公衆トイレ'],['09:00','根子岳'],['10:30','分岐'],['10:40','分岐'],['10:45','四阿山'],
            ['10:50','分岐'],['11:00','分岐'],['11:10','分岐'],['11:35','中四阿'],['11:45','分岐'],
            ['12:05','小四阿'],['13:05','四阿山登山口（中四阿経由）'],['13:10','菅平牧場公衆トイレ']
          ];
          if (!Array.isArray(r.itinerary)) fail('itinerary missing');
          const got = new Map(r.itinerary.map(x => [x.time, x.place]));
          for (const [t,p] of expected) if (got.get(t) !== p) fail(`${t}: ${got.get(t)} != ${p}`);
          if (r.routeImageIndex !== 0) fail(`routeImageIndex=${r.routeImageIndex}`);
          console.log('LIVE_GEMINI_QA_PASS');
          NODE
